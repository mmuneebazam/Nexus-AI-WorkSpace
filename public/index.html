<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus AI — Full-Stack AI Workspace</title>
  <meta name="description" content="Demo full-stack AI workspace: Express REST API, streaming AI chat, project CRUD, and interactive API docs." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23818cf8' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <defs>
            <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#818cf8"/>
              <stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <path fill="url(#brand-grad)" d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/>
        </svg>
        <div class="brand-text">
          <strong>Nexus AI</strong>
          <span>Workspace demo</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-view="dashboard" title="Dashboard">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="chat" title="AI Chat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>AI Chat</span>
        </button>
        <button class="nav-item" data-view="projects" title="Projects">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Projects</span>
        </button>
        <button class="nav-item" data-view="api" title="API Reference">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>API Reference</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-pill" id="status-pill">
          <span class="dot"></span>
          <span id="status-text">Connecting…</span>
        </div>
        <div class="sidebar-meta">Node.js · Express · SSE streaming</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-titles">
          <h1 id="view-title">Dashboard</h1>
          <p id="view-sub">Loading…</p>
        </div>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="app.js"></script>
</body>
</html>
